name: Build Wii launcher APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-launcher.ps1'
      - 'third_party/**'
      - '.github/workflows/build-launcher.yml'
jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch upstream source if not yet committed
        shell: pwsh
        run: ./scripts/get-sources.ps1
      - name: Run Automated Test Suite
        shell: pwsh
        run: ./scripts/test-suite.ps1
      - name: Compile Wii Launcher APK
        shell: pwsh
        run: ./scripts/build-launcher.ps1 -BuildOnly
      - uses: actions/upload-artifact@v4
        with:
          name: firestick-wii-launcher-release
          path: dist/*.apk
          if-no-files-found: error
